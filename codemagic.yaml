workflows:
  ios-release:
    name: iOS release (TestFlight / App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Debe coincidir con .fvmrc y con el --flutter-version de Shorebird.
      # Se usa para el pub get / pod install previos; el build real lo hace
      # Shorebird con su propio checkout de esta misma version.
      flutter: 3.35.5
      xcode: latest
      cocoapods: default

      # Grupo definido en Codemagic > Environment variables.
      # Debe contener SHOREBIRD_TOKEN, marcado como secure. La CLI lo lee
      # sola, no hay que pasarlo por flag.
      #
      # El token es una API key creada en console.shorebird.dev
      # (Account > API Keys). El viejo `shorebird login:ci` ya no existe.
      # Las keys empiezan con "sb_api_" y por defecto expiran al ano: si el
      # build falla por autenticacion, revisa primero si vencio.
      groups:
        - shorebird
        # Debe contener CERTIFICATE_PRIVATE_KEY: la llave RSA privada con la
        # que se emite el certificado de distribucion. Va como secure.
        # Tiene que ser SIEMPRE la misma: si cambia, Apple emite un
        # certificado nuevo en cada build y el limite de la cuenta se agota.
        - apple_signing

      vars:
        BUNDLE_ID: com.diariotiempohn.app

    # Nombre de la API key de App Store Connect cargada en
    # Codemagic > Teams > Integrations > App Store Connect.
    # Expone APP_STORE_CONNECT_ISSUER_ID / _KEY_IDENTIFIER / _PRIVATE_KEY,
    # que la CLI `app-store-connect` toma sola.
    integrations:
      app_store_connect: DiarioTiempo_ASC_Key

    scripts:
      - name: Instalar Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV

      - name: Flutter packages
        script: flutter pub get

      - name: Instalar pods
        script: find . -name "Podfile" -execdir pod install \;

      # Firma explicita en vez del bloque `ios_signing`. El bloque falla con
      # "No matching profiles found" cuando el certificado de distribucion o el
      # perfil todavia no existen en la cuenta; `--create` los genera en vez de
      # solo buscarlos. Ademas, al ser tres pasos separados, el log dice cual
      # de los tres rompio.
      - name: Obtener certificado y perfil de firma
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Cargar el certificado al llavero
        script: keychain initialize && keychain add-certificates

      - name: Aplicar los perfiles al proyecto Xcode
        script: xcode-project use-profiles

      # `shorebird release` en vez de `flutter build ipa`: es lo que registra
      # el release en Shorebird y deja el binario parcheable con
      # `shorebird patch ios`. Un IPA hecho con flutter build NO lo es.
      #
      # Los client IDs de Google ya no van por --dart-define: estan como
      # defaultValue en lib/config/google_sign_in.config.dart. Pasarlos vacios
      # desde aqui los sobreescribiria con "" y romperia el login.
      - name: Shorebird release iOS
        script: |
          shorebird release ios --flutter-version=3.35.5 -- \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Cambia a true cuando quieras que pase a revision automaticamente.
        submit_to_app_store: false
