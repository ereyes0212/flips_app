workflows:
  # Android compila en mac_mini_m2 aunque no necesite macOS, y es a proposito:
  # el plan gratuito da 500 minutos al mes SOLO en macOS M2. Linux y Windows no
  # tienen minutos gratis, se cobran a $0.045/min desde el primero. Correr este
  # workflow en linux_x2 costaba ~$1 por build mientras los minutos de mac
  # quedaban sin usar.
  #
  # Este workflow existe porque compilar Android en local dejo de ser viable:
  # Smart App Control de Windows bloquea el `gen_snapshot.exe` del checkout de
  # Flutter 3.35.5 de Shorebird (binario sin firma y sin reputacion; el de
  # Flutter normal y el de Shorebird 3.44.9 si pasan). SAC no admite exclusiones
  # por carpeta y apagarlo es irreversible sin reinstalar Windows.
  android-release:
    name: Android release (AAB para Play)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      # Misma version que .fvmrc y que el --flutter-version de Shorebird.
      flutter: 3.35.5

      groups:
        # SHOREBIRD_TOKEN, igual que en iOS.
        - shorebird

      # Keystore subido en Codemagic > codemagic.yaml settings > Code signing
      # identities > pestana "Android keystores", con este Reference name.
      #
      # El nombre tiene que coincidir exacto: si no, Codemagic no expone las
      # variables y el build se cae en el paso siguiente.
      #
      # Expone CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS /
      # CM_KEY_PASSWORD.
      android_signing:
        - diariotiempo_upload

    scripts:
      - name: Instalar Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV

      # android/app/build.gradle.kts lee la firma de android/key.properties, que
      # no esta en el repo (lleva contrasenas). Si falta, ESE build.gradle firma
      # con la llave de debug y solo deja un warning: el AAB se genera igual y
      # Play lo rechaza al subirlo. Por eso aca se corta el build en vez de
      # avisar.
      - name: Generar key.properties
        script: |
          set -e

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "Codemagic no expuso el keystore. Revisa que el Reference name"
            echo "en Code signing identities sea exactamente 'diariotiempo_upload'."
            exit 1
          fi

          {
            echo "storeFile=$CM_KEYSTORE_PATH"
            echo "storePassword=$CM_KEYSTORE_PASSWORD"
            echo "keyAlias=$CM_KEY_ALIAS"
            echo "keyPassword=$CM_KEY_PASSWORD"
          } > "$CM_BUILD_DIR/android/key.properties"

      - name: Flutter packages
        script: flutter pub get

      # Sin --build-number a proposito: el versionCode sale de pubspec.yaml.
      #
      # $BUILD_NUMBER es un contador de Codemagic que no sabe nada de lo que ya
      # subiste a Play. Si queda por debajo del ultimo versionCode publicado,
      # Play rechaza el AAB; y peor, el numero cambia solo entre builds. El
      # versionCode de Play tiene que crecer siempre, asi que se controla a mano
      # subiendo la version en pubspec.yaml.
      - name: Shorebird release Android
        script: shorebird release android --flutter-version=3.35.5

    artifacts:
      - build/app/outputs/bundle/**/*.aab
      # Sin esto, los stack traces de Crashlytics llegan ofuscados por R8.
      - build/app/outputs/**/mapping.txt

    # No se publica solo: el AAB se sube a mano a la prueba interna. Para
    # automatizarlo hace falta una cuenta de servicio de Google Play.

  ios-release:
    name: iOS release (TestFlight / App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Debe coincidir con .fvmrc y con el --flutter-version de Shorebird.
      # Se usa para el pub get / pod install previos; el build real lo hace
      # Shorebird con su propio checkout de esta misma version.
      flutter: 3.35.5
      xcode: latest
      cocoapods: default

      # Grupo definido en Codemagic > Environment variables.
      # Debe contener SHOREBIRD_TOKEN, marcado como secure. La CLI lo lee
      # sola, no hay que pasarlo por flag.
      #
      # El token es una API key creada en console.shorebird.dev
      # (Account > API Keys). El viejo `shorebird login:ci` ya no existe.
      # Las keys empiezan con "sb_api_" y por defecto expiran al ano: si el
      # build falla por autenticacion, revisa primero si vencio.
      groups:
        - shorebird
        # Debe contener CERTIFICATE_PRIVATE_KEY: la llave RSA privada con la
        # que se emite el certificado de distribucion. Va como secure.
        # Tiene que ser SIEMPRE la misma: si cambia, Apple emite un
        # certificado nuevo en cada build y el limite de la cuenta se agota.
        - apple_signing

      vars:
        BUNDLE_ID: com.diariotiempohn.app

    # Nombre de la API key de App Store Connect cargada en
    # Codemagic > Teams > Integrations > App Store Connect.
    # Expone APP_STORE_CONNECT_ISSUER_ID / _KEY_IDENTIFIER / _PRIVATE_KEY,
    # que la CLI `app-store-connect` toma sola.
    integrations:
      app_store_connect: DiarioTiempo_ASC_Key

    scripts:
      - name: Instalar Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV

      - name: Flutter packages
        script: flutter pub get

      - name: Instalar pods
        script: find . -name "Podfile" -execdir pod install \;

      # Firma explicita en vez del bloque `ios_signing`. El bloque falla con
      # "No matching profiles found" cuando el certificado de distribucion o el
      # perfil todavia no existen en la cuenta; `--create` los genera en vez de
      # solo buscarlos. Ademas, al ser tres pasos separados, el log dice cual
      # de los tres rompio.
      - name: Obtener certificado y perfil de firma
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Cargar el certificado al llavero
        script: keychain initialize && keychain add-certificates

      - name: Aplicar los perfiles al proyecto Xcode
        script: xcode-project use-profiles

      # `shorebird release` en vez de `flutter build ipa`: es lo que registra
      # el release en Shorebird y deja el binario parcheable con
      # `shorebird patch ios`. Un IPA hecho con flutter build NO lo es.
      #
      # Los client IDs de Google ya no van por --dart-define: estan como
      # defaultValue en lib/config/google_sign_in.config.dart. Pasarlos vacios
      # desde aqui los sobreescribiria con "" y romperia el login.
      # Sin --build-number, igual que en Android: el numero sale de pubspec.yaml.
      #
      # $BUILD_NUMBER es el contador de la app EN CODEMAGIC, no el de la tienda.
      # Al recrear la app en la cuenta personal ese contador arranco de cero y
      # un build salio como 1.1.1 (2) cuando en App Store Connect ya existian
      # la (5) y la (7). Cuando el contador llegue a 5, la subida falla por
      # numero repetido.
      #
      # Desde pubspec.yaml el numero es el mismo en las dos tiendas y lo
      # controla quien sube la version, que es donde tiene que estar.
      - name: Shorebird release iOS
        script: |
          shorebird release ios --flutter-version=3.35.5 -- \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Cambia a true cuando quieras que pase a revision automaticamente.
        submit_to_app_store: false

  # Compila para el simulador y deja el .app como artefacto, que es lo que
  # habilita el boton "Quick Launch" de App Preview: abre la app en un
  # simulador dentro del navegador, sin dispositivo fisico.
  #
  # Sirve sobre todo para revisar el layout en iPad, que es lo que App Review
  # va a probar. NO sirve para push (APNs no llega a un simulador) ni para
  # validar anuncios o login social.
  #
  # No lleva firma ni Shorebird a proposito: el simulador no usa certificados,
  # y eso lo deja en unos 5-8 minutos en vez de los ~25 del release.
  ios-simulator:
    name: iOS preview en navegador (simulador)
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: 3.35.5
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter packages
        script: flutter pub get

      - name: Instalar pods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build para simulador
        script: flutter build ios --simulator

    # La ruta del .app es lo que Codemagic detecta para ofrecer Quick Launch.
    artifacts:
      - build/ios/iphonesimulator/Runner.app
